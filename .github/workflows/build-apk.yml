name: Build AytO Matcher APK

on:
  push:
    paths:
      - "aytomatcher/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aytomatcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Rechenkern testen und Debug-APK bauen
        run: ./gradlew :core:test :app:assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk AytO-Matcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AytO-Matcher-APK
          path: aytomatcher/AytO-Matcher.apk

      - name: Release mit APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aytomatcher-build-${{ github.run_number }}
          name: AytO Matcher Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: aytomatcher/AytO-Matcher.apk
